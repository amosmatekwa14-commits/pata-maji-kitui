<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery - Pata Maji Kwa Vonza</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f6fbfc;color:#0a2a3a;padding:16px}
.top{max-width:600px;margin:0 auto;text-align:center;padding:10px}
.top h1{font-size:24px}.top p{color:#666;font-size:13px;margin-top:4px}
.login{max-width:400px;margin:30px auto;background:white;padding:25px;border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,.08);text-align:center}
.login h2{margin-bottom:12px}
input{width:100%;padding:13px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;margin-top:8px}
button{width:100%;background:#00a651;color:white;border:none;padding:14px;border-radius:999px;font-size:16px;font-weight:900;margin-top:14px;cursor:pointer}
button.grey{background:#0a2a3a}
.orders{max-width:600px;margin:15px auto;display:none}
.card{background:white;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 6px 18px rgba(0,0,0,.06);border-left:6px solid #00a651}
.card.delivered{border-left-color:#ccc;opacity:.6}
.card h3{font-size:18px;margin-bottom:8px}
.card p{font-size:14px;line-height:1.7;color:#333}
.card b{color:#0a2a3a}
.badge{background:#d4edda;color:#155724;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:900}
.badge.pending{background:#fff3cd;color:#856404}
.small{font-size:12px;color:#888;margin-top:8px}
.topbar{display:flex;justify-content:space-between;align-items:center;max-width:600px;margin:0 auto}
.refresh{background:#0077cc;color:white;border:none;padding:10px 16px;border-radius:999px;font-weight:800;cursor:pointer;width:auto}
#status{text-align:center;margin:10px;font-weight:700;font-size:13px;color:#666}
#newAlert{display:none;background:#ffcc00;color:#000;text-align:center;padding:14px;font-weight:900;font-size:18px;border-radius:12px;max-width:600px;margin:10px auto;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0.5}}
</style>
</head>
<body>
<div class="top">
  <h1>💧 PATA MAJI - DELIVERY</h1>
  <p id="whoLabel">Kwa Vonza • 0768814375 • Auto-refresh ON 🔊</p>
</div>
<div id="newAlert">🔔 NEW ORDER! 🔔 SCROLL DOWN</div>
<div id="loginBox" class="login">
  <h2>Delivery Login</h2>
  <p style="font-size:13px;color:#666">Use your phone + PIN given by boss</p>
  <input id="dPhone" type="tel" placeholder="Phone e.g. 0114403276">
  <input id="dPin" type="password" placeholder="PIN e.g. 3276" inputmode="numeric">
  <button onclick="login()">LOGIN →</button>
  <p id="loginErr" style="color:red;font-size:13px;margin-top:10px;display:none">Wrong phone or PIN. Call boss.</p>
  <button onclick="testBeep()" style="background:#0077cc">🔊 TEST SOUND</button>
  <p style="font-size:12px;color:#999;margin-top:8px">Tap TEST SOUND once to allow beep.</p>
</div>
<div id="ordersBox" style="display:none">
  <div class="topbar">
    <b id="countLabel">0 Orders</b>
    <button class="refresh" onclick="loadOrders()">🔄 Refresh</button>
  </div>
  <p id="status">Loading orders...</p>
  <div id="list" class="orders" style="display:block"></div>
  <div style="max-width:600px;margin:0 auto">
    <button class="grey" onclick="logout()">Logout</button>
  </div>
</div>
<script>
const API = "";
let currentPerson = null;
let lastCount = 0; let firstLoad = true; let beepEnabled = false;
function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<3;i++){ const o = ctx.createOscillator(); const g = ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value = 880; o.type='sine'; g.gain.setValueAtTime(0.5, ctx.currentTime + i*0.4); o.start(ctx.currentTime + i*0.4); o.stop(ctx.currentTime + i*0.4 + 0.3); }
    if(navigator.vibrate) navigator.vibrate([500,200,500,200,500]);
  }catch(e){}
}
function testBeep(){ beepEnabled=true; playBeep(); alert('✅ Sound ON! Leave this page open.'); }
async function login(){
  const phone = document.getElementById('dPhone').value.trim();
  const pin = document.getElementById('dPin').value.trim();
  if(!phone || !pin){ document.getElementById('loginErr').style.display='block'; return; }
  try{
    const res = await fetch(API + '/api/delivery/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ phone, pin }) });
    const data = await res.json();
    if(!data.success){ document.getElementById('loginErr').style.display='block'; return; }
    currentPerson = data.person;
    localStorage.setItem('pata_delivery', JSON.stringify(currentPerson));
    document.getElementById('whoLabel').innerText = '👋 ' + currentPerson.name + ' • ' + currentPerson.area + ' • Auto-refresh ON 🔊';
    document.getElementById('loginBox').style.display='none';
    document.getElementById('ordersBox').style.display='block';
    loadOrders();
    setInterval(loadOrders, 30000);
  }catch(e){ document.getElementById('loginErr').style.display='block'; }
}
function logout(){ localStorage.removeItem('pata_delivery'); location.reload(); }
async function loadOrders(){
  const list = document.getElementById('list');
  const status = document.getElementById('status');
  try{
    const res = await fetch(API + '/api/orders');
    const data = await res.json();
    const orders = Array.isArray(data) ? data : (data.orders || []);
    if(!firstLoad && orders.length > lastCount){
      document.getElementById('newAlert').style.display='block';
      playBeep();
      setTimeout(()=>{ document.getElementById('newAlert').style.display='none'; }, 10000);
    }
    lastCount = orders.length; firstLoad = false;
    if(orders.length === 0){
      status.innerText = 'No orders yet. Auto-checking every 30 sec...';
      list.innerHTML = '';
      document.getElementById('countLabel').innerText = '0 Orders';
      return;
    }
    renderOrders(orders);
  }catch(e){ status.innerText = '⚠️ Cannot load orders. Retrying in 30 sec...'; }
}
function renderOrders(orders){
  const list = document.getElementById('list');
  const status = document.getElementById('status');
  const active = orders.filter(o => (o.status||'PAID') !== 'DELIVERED');
  document.getElementById('countLabel').innerText = active.length + ' To Deliver • ' + orders.length + ' Total';
  status.innerText = active.length === 0 ? '🎉 All delivered! Auto-checking...' : '🔊 Leave page open - it will BEEP on new order. Tap CALL to call customer, tap DELIVERED when done.';
  list.innerHTML = orders.map((o,i)=>{
    const isDone = (o.status === 'DELIVERED');
    return `
    <div class="card ${isDone ? 'delivered':''}" id="card-${i}">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3>${o.name || 'Customer'} - ${o.product || ''} x ${o.qty || 1}</h3>
        <span class="badge ${isDone ? '':'pending'}">${isDone ? 'DELIVERED':'TO DELIVER'}</span>
      </div>
      <p>
        <b>📍 Located at:</b> ${o.location || o.address || 'NDELI'}<br>
        <b>🏠 House no:</b> ${o.houseNo || '-'}<br>
        <b>📝 Notes:</b> ${o.notes || '-'}<br>
        <b>💰 Amount:</b> KSh ${(o.amount||0).toLocaleString()} &nbsp; • &nbsp; <b>Receipt:</b> ${o.receipt || o.checkoutId || '-'}<br>
        <b>📞 Phone:</b> ${o.phone || ''}<br>
        ${o.deliveredBy ? `<b>✅ Delivered by:</b> ${o.deliveredBy}` : ''}
      </p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px">
        <a href="tel:${o.phone}"><button style="margin:0;background:#0077cc">📞 CALL</button></a>
        <button style="margin:0;${isDone ? 'background:#ccc':''}" onclick="markDone(${i}, '${o.receipt||o.checkoutId||i}')" ${isDone ? 'disabled':''}>${isDone ? '✅ DONE':'✅ MARK DELIVERED'}</button>
      </div>
      <p class="small">Order ID: ${o.checkoutId || o.receipt || i}</p>
    </div>`;
  }).join('');
}
async function markDone(i, id){
  if(!confirm('Mark this as DELIVERED by ' + (currentPerson ? currentPerson.name : 'you') + '?')) return;
  document.getElementById('card-'+i).classList.add('delivered');
  try{ await fetch(API + '/api/orders/' + id + '/delivered', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ deliveredBy: currentPerson ? currentPerson.name : '' }) }); }catch(e){}
  alert('✅ Marked delivered!');
  loadOrders();
}
// Auto-login if already logged in
try{
  const saved = JSON.parse(localStorage.getItem('pata_delivery')||'null');
  if(saved){
    currentPerson = saved;
    document.getElementById('whoLabel').innerText = '👋 ' + saved.name + ' • ' + saved.area + ' • Auto-refresh ON 🔊';
    document.getElementById('loginBox').style.display='none';
    document.getElementById('ordersBox').style.display='block';
    loadOrders(); setInterval(loadOrders, 30000);
  }
}catch(e){}
document.getElementById('dPin').addEventListener('keypress', e=>{ if(e.key==='Enter') login(); });
</script>
</body>
</html>
